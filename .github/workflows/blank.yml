# Tès otomatik sou chak push: kalkil kòb yo, lekti SMS yo, ak règ sekirite Firestore yo.
name: Tès

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Kalkil kòb ak SMS
        run: npm test
      - name: Règ sekirite Firestore
        run: |
          npm i --no-save @firebase/rules-unit-testing@5.0.2
          npm run test:rules
      - name: Build
        run: npx vite build
